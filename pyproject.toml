[project]
name = "facescenes"
version = "1.0.0"
description = "Data analysis for two gaze-contingent eye-tracking experiments on scene previews and face detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sule Tasliyurt-Celebi" },
    { name = "Katharina Dobs" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "Pillow>=9.5",
    "jupyter>=1.0",
    "pytest>=7.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "codespell>=2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["zenodo: downloads the published Zenodo record (needs network access)"]
addopts = "-m 'not zenodo'"
